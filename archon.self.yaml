name: Archon
solution: Archon.sln

rules:
  - id: layers
    kind: layers
    description: CLI analiz motoruna, analiz motoru çekirdeğe bağlanır.
    layers:
      - "*.Cli"
      - "*.Analysis"
      - "*.Core"

  - id: src-must-not-depend-on-tests
    kind: deny
    description: Üretim kodu test projelerine bağlanamaz.
    from:
      - "Archon.Core"
      - "Archon.Analysis"
      - "Archon.Cli"
    to: "*Tests*"

  - id: core-no-cli-packages
    kind: package-deny
    description: Çekirdek katmanı CLI paketlerine bağlanamaz.
    from: Archon.Core
    packages:
      - Spectre.Console*

  - id: no-cycles
    kind: acyclic
    description: Proje grafı döngü içeremez.

  - id: core-fanout
    kind: max-fanout
    description: Çekirdek giden bağımlılık taşıyamaz.
    from: Archon.Core
    max: 0

  - id: cli-must-use-analysis
    kind: must-depend
    description: CLI analiz katmanına bağlanmalı.
    from: Archon.Cli
    to: Archon.Analysis

  - id: cli-depth
    kind: max-depth
    description: CLI derinlik sınırı.
    from: Archon.Cli
    max: 3

  - id: tfm-aligned
    kind: tfm-aligned
    description: Archon projeleri aynı TFM'de olmalı.

  - id: core-no-test-reach
    kind: deny-transitive
    description: Çekirdek test projelerine ulaşamaz.
    from: Archon.Core
    to: "*Tests*"

  - id: core-no-web-sdk
    kind: sdk-deny
    description: Çekirdek web SDK kullanamaz.
    from: Archon.Core
    sdks:
      - "*.Web"
      - Microsoft.NET.Sdk.Web

