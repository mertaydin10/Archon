name: Archon

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test Archon.sln --nologo

      - name: Kural kalıplarını denetle
        run: dotnet run --project src/Archon.Cli -- validate archon.self.yaml --strict

      - name: PR'da değişen projeleri işaretle
        if: github.event_name == 'pull_request'
        run: dotnet run --project src/Archon.Cli -- analyze Archon.sln --rules archon.self.yaml --since "origin/${{ github.base_ref }}" --format github

      - name: Kendi mimarisini doğrula
        run: dotnet run --project src/Archon.Cli -- analyze Archon.sln --rules archon.self.yaml --format markdown --out artifacts/archon.md

      - name: Özeti GitHub'a yaz
        if: always()
        run: |
          if [ -f artifacts/archon.md ]; then
            cat artifacts/archon.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Contoso örneği kasıtlı olarak kırılmalı
        run: |
          set +e
          dotnet run --project src/Archon.Cli -- analyze samples/ContosoShop/ContosoShop.sln --rules archon.yaml --format junit --out artifacts/contoso-junit.xml
          test $? -eq 1

      - name: Bağlaşım özeti
        run: dotnet run --project src/Archon.Cli -- stats samples/ContosoShop/ContosoShop.sln --rules archon.yaml

      - name: Mermaid graf üret
        run: dotnet run --project src/Archon.Cli -- graph Archon.sln --rules archon.self.yaml --format mermaid --out artifacts/graph.mmd

      - name: Diff ( Contoso baseline yok, kendi raporu )
        run: |
          dotnet run --project src/Archon.Cli -- analyze Archon.sln --rules archon.self.yaml --write-baseline artifacts/self-baseline.json
          dotnet run --project src/Archon.Cli -- diff artifacts/self-baseline.json Archon.sln --rules archon.self.yaml

      - name: En kısa yol
        run: dotnet run --project src/Archon.Cli -- path Archon.Cli Archon.Core --rules archon.self.yaml
