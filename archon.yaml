# yaml-language-server: $schema=./archon.schema.json
name: Contoso Shop
solution: samples/ContosoShop/ContosoShop.sln
exclude:
  - "*Tests*"
includes:
  - rules/packages.yaml

rules:
  - id: domain-isolation
    kind: deny
    description: Domain, Infrastructure veya Api'ye bağlanamaz.
    from: "*.Domain"
    to:
      - "*.Infrastructure"
      - "*.Api"

  - id: catalog-must-not-know-payments
    kind: deny
    description: Catalog, Payments'a proje referansı veremez.
    from: "*Catalog*"
    to: "*Payments*"

  - id: catalog-surface
    kind: allow
    description: Catalog yalnızca Domain'e bağlanabilir.
    from: "*Catalog*"
    to:
      - "*.Domain"

  - id: domain-no-infra-namespace
    kind: namespace-deny
    description: Domain kaynakları Infrastructure namespace'ini import edemez.
    from: "*.Domain"
    to: "Contoso.Infrastructure*"

  - id: catalog-no-payments-namespace
    kind: namespace-deny
    description: Catalog kaynakları Payments namespace'ini import edemez.
    from: "*Catalog*"
    to: "Contoso.Payments*"

  - id: clean-architecture
    kind: layers
    description: Dış katman içe bağlanır; tersi yasak.
    layers:
      - "*.Api"
      - "*.Infrastructure"
      - "*.Application"
      - "*.Domain"

  - id: no-cycles
    kind: acyclic
    description: Proje grafı döngü içeremez.

  - id: api-fanout
    kind: max-fanout
    description: Api çok sayıda projeye doğrudan bağlanamaz.
    from: "*.Api"
    max: 2

  - id: stable-dependencies
    kind: sdp
    description: Kararlı modül, daha kararsız olana bağlanamaz.

  - id: catalog-payments-isolated
    kind: isolated
    description: Catalog ve Payments bağlamları birbirini görmemeli.
    from: "*Catalog*"
    to: "*Payments*"

  - id: newtonsoft-aligned
    kind: version-aligned
    description: Newtonsoft.Json sürümü solution genelinde aynı olmalı.
    packages:
      - Newtonsoft.Json

  - id: payments-no-catalog-friends
    kind: internals-deny
    description: Payments, Catalog'a InternalsVisibleTo veremez.
    from: "*Payments*"
    to: "*Catalog*"

  - id: api-must-touch-domain
    kind: must-depend
    description: Api, Domain'e doğrudan bağlanmalı.
    from: "*.Api"
    to: "*.Domain"

  - id: domain-fanin
    kind: max-fanin
    description: Domain çok fazla gelen bağımlılık taşıyamaz.
    from: "*.Domain"
    max: 2

  - id: api-depth
    kind: max-depth
    description: Api'nin bağımlılık derinliği sınırlıdır.
    from: "*.Api"
    max: 3

  - id: tfm-aligned
    kind: tfm-aligned
    description: TargetFramework solution genelinde aynı olmalı.

